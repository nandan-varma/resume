<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 16px; width: 220px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #18181b; color: #fff; font-size: 13px; }
  h1 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  p { font-size: 12px; color: #a1a1aa; margin: 0 0 14px; line-height: 1.5; }
  a { display: block; text-align: center; background: #6366f1; color: #fff; text-decoration: none; border-radius: 8px; padding: 9px; font-size: 12px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.on { background: #22c55e; }
  .dot.off { background: #71717a; }
</style>
</head>
<body>
  <h1>🎯 JobMatch</h1>
  <div class="status"><div class="dot" id="dot"></div><span id="status-text">Checking…</span></div>
  <p id="desc">Loading…</p>
  <a id="cta" href="#" target="_blank">Open Dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
