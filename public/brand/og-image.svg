<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top-left accent line -->
  <line x1="0" y1="4" x2="1200" y2="4" stroke="#ffffff" stroke-width="2" opacity="0.08"/>

  <!-- Icon mark (centered, large) -->
  <g transform="translate(524, 168)">
    <rect width="152" height="152" rx="34" fill="#ffffff" opacity="0.08"/>
    <rect width="152" height="152" rx="34" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
    <!-- J letterform -->
    <line x1="50" y1="33" x2="102" y2="33"
          stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M 102 33 L 102 99 Q 102 122 80 122 Q 58 122 55 106"
          stroke="white" stroke-width="18" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
  </g>

  <!-- "JobMatch" wordmark -->
  <text x="600" y="402"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-2"
        text-anchor="middle"
        fill="white">JobMatch</text>

  <!-- Tagline -->
  <text x="600" y="458"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26"
        font-weight="400"
        letter-spacing="0.2"
        text-anchor="middle"
        fill="#888888">AI-powered resume matching</text>

  <!-- Bottom divider -->
  <line x1="480" y1="510" x2="720" y2="510" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

  <!-- URL hint -->
  <text x="600" y="548"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="0.5"
        text-anchor="middle"
        fill="#555555">jobmatch.app</text>
</svg>
